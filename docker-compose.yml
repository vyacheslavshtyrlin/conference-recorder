name: conference-recording

services:
  recording-capture-1:
    init: true
    image: ${RECORDING_IMAGE:-conference-recording-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      RECORDING_BOT_BIND_HOST: 0.0.0.0
      RECORDING_BOT_PORT: 8090
      RECORDING_BOT_WORKER_ID: recording-worker-1
      RECORDING_BOT_MAX_SLOTS: ${RECORDING_BOT_MAX_SLOTS:-10}
      RECORDING_COMPOSITION_SERVICE_SECRET: ""
    ports:
      - "${RECORDING_BOT_BIND_ADDR:-127.0.0.1}:${RECORDING_CAPTURE_PORT_1:-8091}:8090"
    volumes:
      - recording-capture-1-data:/var/lib/conference-recording
    cpus: "${RECORDING_BOT_CPUS:-6.0}"
    cpu_shares: 1024
    mem_limit: "${RECORDING_BOT_MEMORY_LIMIT:-8g}"
    pids_limit: "${RECORDING_BOT_PIDS_LIMIT:-512}"
    restart: unless-stopped

  recording-capture-2:
    init: true
    image: ${RECORDING_IMAGE:-conference-recording-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      RECORDING_BOT_BIND_HOST: 0.0.0.0
      RECORDING_BOT_PORT: 8090
      RECORDING_BOT_WORKER_ID: recording-worker-2
      RECORDING_BOT_MAX_SLOTS: ${RECORDING_BOT_MAX_SLOTS:-10}
      RECORDING_COMPOSITION_SERVICE_SECRET: ""
    ports:
      - "${RECORDING_BOT_BIND_ADDR:-127.0.0.1}:${RECORDING_CAPTURE_PORT_2:-8092}:8090"
    volumes:
      - recording-capture-2-data:/var/lib/conference-recording
    cpus: "${RECORDING_BOT_CPUS:-6.0}"
    cpu_shares: 1024
    mem_limit: "${RECORDING_BOT_MEMORY_LIMIT:-8g}"
    pids_limit: "${RECORDING_BOT_PIDS_LIMIT:-512}"
    restart: unless-stopped

  recording-capture-3:
    init: true
    image: ${RECORDING_IMAGE:-conference-recording-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      RECORDING_BOT_BIND_HOST: 0.0.0.0
      RECORDING_BOT_PORT: 8090
      RECORDING_BOT_WORKER_ID: recording-worker-3
      RECORDING_BOT_MAX_SLOTS: ${RECORDING_BOT_MAX_SLOTS:-10}
      RECORDING_COMPOSITION_SERVICE_SECRET: ""
    ports:
      - "${RECORDING_BOT_BIND_ADDR:-127.0.0.1}:${RECORDING_CAPTURE_PORT_3:-8093}:8090"
    volumes:
      - recording-capture-3-data:/var/lib/conference-recording
    cpus: "${RECORDING_BOT_CPUS:-6.0}"
    cpu_shares: 1024
    mem_limit: "${RECORDING_BOT_MEMORY_LIMIT:-8g}"
    pids_limit: "${RECORDING_BOT_PIDS_LIMIT:-512}"
    restart: unless-stopped

  recording-capture-4:
    init: true
    image: ${RECORDING_IMAGE:-conference-recording-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      RECORDING_BOT_BIND_HOST: 0.0.0.0
      RECORDING_BOT_PORT: 8090
      RECORDING_BOT_WORKER_ID: recording-worker-4
      RECORDING_BOT_MAX_SLOTS: ${RECORDING_BOT_MAX_SLOTS:-10}
      RECORDING_COMPOSITION_SERVICE_SECRET: ""
    ports:
      - "${RECORDING_BOT_BIND_ADDR:-127.0.0.1}:${RECORDING_CAPTURE_PORT_4:-8094}:8090"
