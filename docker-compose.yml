name: conference-recording

services:
  recording-capture-1:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      NODE_ENV: production
      RECORDING_BOT_BIND_HOST: 0.0.0.0
      RECORDING_BOT_PORT: 8090
      RECORDING_BOT_PUBLIC_ORIGIN: http://127.0.0.1:8090
      RECORDING_BOT_WORKER_ID: recording-worker-1
      RECORDING_BOT_MAX_SLOTS: ${RECORDING_BOT_MAX_SLOTS:-10}
    ports:
      - "${RECORDING_BOT_BIND_ADDR:-127.0.0.1}:${RECORDING_CAPTURE_PORT_1:-8091}:8090"
    volumes:
      - recording-capture-1-data:/var/lib/conference-recording
    shm_size: 1gb
    cpus: "${RECORDING_BOT_CPUS:-2.0}"
    mem_limit: "${RECORDING_BOT_MEMORY_LIMIT:-2g}"
    pids_limit: "${RECORDING_BOT_PIDS_LIMIT:-256}"
    restart: unless-stopped

  recording-capture-2:
