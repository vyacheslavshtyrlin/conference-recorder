name: conference-recording

services:
  recording-bot:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      NODE_ENV: production
      RECORDING_BOT_BIND_HOST: 0.0.0.0
      RECORDING_BOT_PORT: 8090
    ports:
      - "${RECORDING_BOT_BIND_ADDR:-127.0.0.1}:8090:8090"
    volumes:
      - recording-capture-data:/var/lib/conference-recording
    shm_size: 1gb
    cpus: "${RECORDING_BOT_CPUS:-2.0}"
    mem_limit: "${RECORDING_BOT_MEMORY_LIMIT:-2g}"
    pids_limit: "${RECORDING_BOT_PIDS_LIMIT:-256}"
    restart: unless-stopped

  recording-composition:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/composition.js"]
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      NODE_ENV: production
    healthcheck:
      disable: true
    volumes:
      - recording-composition-data:/var/lib/conference-recording
    cpus: "${RECORDING_COMPOSITION_CPUS:-1.0}"
    mem_limit: "${RECORDING_COMPOSITION_MEMORY_LIMIT:-1g}"
    restart: unless-stopped

volumes:
  recording-capture-data:
  recording-composition-data:
