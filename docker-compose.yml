    cpus: "${RECORDING_BOT_CPUS:-6.0}"
    cpu_shares: 1024
    mem_limit: "${RECORDING_BOT_MEMORY_LIMIT:-8g}"
    pids_limit: "${RECORDING_BOT_PIDS_LIMIT:-512}"
    restart: unless-stopped

  recording-composition:
    init: true
    image: ${RECORDING_IMAGE:-conference-recording-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/composition.js"]
    env_file:
      - ${RECORDING_ENV_FILE:-.env.example}
    environment:
      NODE_ENV: production
      RECORDING_CAPTURE_SERVICE_SECRET: ""
      RECORDING_BOT_CONTROL_JWT_HS256_SECRET: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - recording-composition-data:/var/lib/conference-recording
    cpus: "${RECORDING_COMPOSITION_CPUS:-2.0}"
    cpu_shares: 128
    mem_limit: "${RECORDING_COMPOSITION_MEMORY_LIMIT:-4g}"
    pids_limit: "${RECORDING_COMPOSITION_PIDS_LIMIT:-128}"
    restart: unless-stopped

volumes:
  recording-capture-1-data:
  recording-capture-2-data:
  recording-capture-3-data:
  recording-capture-4-data:
  recording-capture-5-data:
  recording-composition-data:
