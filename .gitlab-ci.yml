stages:
  - validate
  - build
  - deploy
  - cleanup
  - setup-nginx

variables:
  DEPLOY_BRANCH: "main"
  IMAGE_ENV_VAR: "RECORDING_IMAGE"
  IMAGE_NAME: "conference-recording-bot"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - 10.1.0.14

validate:
  stage: validate
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - node scripts/run-go.mjs test -timeout 180s ./...
    - npm run test:container --workspace @conference/recording-composition
    - npm run build
    - docker compose --env-file .env.example -f docker-compose.yml config --quiet
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  script:
    - docker build -f Dockerfile -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" -t "${IMAGE_NAME}:latest" .
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

deploy:
  stage: deploy
  environment:
    name: prod
  script:
    - |
      deploy_env_prod="${DEPLOY_ENV_PROD:-}"
      if [ -z "$deploy_env_prod" ] || [ ! -f "$deploy_env_prod" ] || [ ! -s "$deploy_env_prod" ]; then
        echo "DEPLOY_ENV_PROD must be a non-empty GitLab file variable"
        exit 1
      fi
      if grep -Eq '^[[:space:]]*(export[[:space:]]+)?(DATABASE_URL|RECORDING_S3_ACCESS_KEY_ID|RECORDING_S3_SECRET_ACCESS_KEY)[[:space:]]*=' "$deploy_env_prod"; then
        echo "DEPLOY_ENV_PROD contains API-only database or permanent S3 credentials"
        exit 1
      fi
      export RECORDING_ENV_FILE="$deploy_env_prod"
    - export ${IMAGE_ENV_VAR}="${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - |
      for service in recording-capture-1 recording-capture-2 recording-capture-3 recording-capture-4 recording-capture-5; do
        docker compose --env-file "$RECORDING_ENV_FILE" -f docker-compose.yml up -d --no-build --no-deps --wait "$service"
      done
      docker compose --env-file "$RECORDING_ENV_FILE" -f docker-compose.yml up -d --no-build --no-deps --wait recording-composition
      docker compose --env-file "$RECORDING_ENV_FILE" -f docker-compose.yml up -d --no-build --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

cleanup:
  stage: cleanup
  script:
    - docker container prune --force --filter "until=24h"
    - docker image prune --force --filter "until=24h"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: always

setup-nginx-prod:
  stage: setup-nginx
  tags:
    - 10.1.0.14
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true
  needs: []
  script:
    - test -n "$LETSENCRYPT_EMAIL" || { echo "Задайте CI/CD-переменную LETSENCRYPT_EMAIL"; exit 1; }
    - docker network create conference-recording_default 2>/dev/null || true
    - docker compose -f docker-compose.nginx.prod.yml build certbot
    - docker compose -f docker-compose.nginx.prod.yml up -d --force-recreate
    - docker image prune -f
