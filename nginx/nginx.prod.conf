server {
    listen 80;
    server_name recorder.victoryspace.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name recorder.victoryspace.ru;

    ssl_certificate     /etc/letsencrypt/live/recorder.victoryspace.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recorder.victoryspace.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Контрольные JSON- payload-ы воркеров ограничены 64 KB на стороне бота;
    # Media bytes bypass nginx; this endpoint exposes only the private worker control plane.
    client_max_body_size 10m;

    # --- Capture worker 1: /workers/1/... -> recording-capture-1:8090/... ---
    location /workers/1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $worker recording-capture-1;
        rewrite ^/workers/1/(.*)$ /$1 break;
        proxy_pass http://$worker:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Capture worker 2 ---
    location /workers/2/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $worker recording-capture-2;
        rewrite ^/workers/2/(.*)$ /$1 break;
        proxy_pass http://$worker:8090;
        proxy_http_version 1.1;
